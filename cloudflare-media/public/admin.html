<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anilarper Media Admin</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{font:16px system-ui;max-width:760px;margin:24px auto;padding:0 16px;background:#101318;color:#f2f4f8}
.card{background:#1b222c;border:1px solid #303b49;border-radius:14px;padding:16px;margin:14px 0}
input,button{font:inherit;padding:11px;border-radius:9px;border:1px solid #4a5667;background:#202a36;color:inherit}
input:not([type=file]){width:100%;margin:6px 0 12px}input[type=file]{width:100%;margin:10px 0}
button{background:#8064dc;border:0;color:white;font-weight:650;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}
button.secondary{background:#303b49}button.danger{background:#a94452}
small,.muted{color:#aab4c2}progress{width:100%;height:18px}li{padding:12px 0;border-bottom:1px solid #303b49;overflow-wrap:anywhere}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}a{color:#b7a4ff}.storage{height:12px;background:#303b49;border-radius:20px;overflow:hidden;margin:10px 0}.storage>span{display:block;height:100%;background:#8064dc;width:0}
.video{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start}.video input{margin-top:4px}.video .meta{min-width:0}.video .actions{margin-top:8px}.warning{color:#ffbd6b}
</style></head><body><h1>Anilarper Media</h1><p class="muted">Public library • Admin-only uploads and management • 10 GB storage cap</p>
<p><a href="/phone-admin">Manage backup phone storage ↗</a> <span class="muted">• Opens the phone's private admin page</span></p>
<section class="card"><label>Admin token<input id="token" type="password" autocomplete="off" placeholder="Enter your private admin token"></label>
<label>Display title<input id="title" placeholder="Optional; defaults to filename"></label>
<label>Category<input id="category" list="cats" value="Anime"></label><datalist id="cats"><option>Anime</option><option>Movies</option><option>Episodes</option><option>Clips</option><option>Trailers</option><option>Other</option></datalist>
<input id="files" type="file" accept="video/mp4,.mp4" multiple><button id="upload">Upload selected MP4s</button>
<p id="status" class="muted" aria-live="polite">Enter your token to manage the library.</p><progress id="progress" value="0" max="100" hidden></progress></section>
<section class="card"><div class="actions"><h2 style="flex:1;margin:0">Storage</h2><button id="refresh" class="secondary">Refresh</button></div>
<p id="usage" class="muted">Loading…</p><div class="storage" role="progressbar" aria-label="Storage used" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="storageBar"></span></div>
<p id="storageHint" class="muted"></p></section>
<section class="card"><div class="actions"><h2 style="flex:1;margin:0">Public videos</h2><button id="selectAll" class="secondary">Select all</button><button id="deleteSelected" class="danger" disabled>Delete selected</button></div>
<p id="selection" class="muted">0 selected</p><ul id="videos" style="list-style:none;padding:0;margin:0"></ul></section>
<script>
const $=id=>document.getElementById(id),token=$('token'),status=$('status'),progress=$('progress');
const selected=new Set();let currentVideos=[];
const auth=()=>({'Authorization':'Bearer '+token.value.trim(),'Content-Type':'application/json'});
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{...auth(),...(opts.headers||{})}});let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j}
function updateSelection(){$('selection').textContent=selected.size+' selected';$('deleteSelected').disabled=selected.size===0}
function renderVideos(videos){
 const list=$('videos');list.replaceChildren();currentVideos=videos;
 for(const v of videos){
  const li=document.createElement('li'),wrap=document.createElement('div'),check=document.createElement('input'),meta=document.createElement('div'),title=document.createElement('a'),details=document.createElement('div'),buttons=document.createElement('div');
  wrap.className='video';check.type='checkbox';check.checked=selected.has(v.id);check.setAttribute('aria-label','Select '+v.title);
  check.onchange=()=>{if(check.checked)selected.add(v.id);else selected.delete(v.id);updateSelection()};
  meta.className='meta';title.href=v.streamPath;title.textContent=v.title;title.target='_blank';title.rel='noopener';
  details.className='muted';details.textContent=v.category+' • '+(v.size/1048576).toFixed(1)+' MB';
  buttons.className='actions';const edit=document.createElement('button');edit.className='secondary';edit.textContent='Organize';
  edit.onclick=async()=>{const name=prompt('Title',v.title);if(name===null)return;const category=prompt('Category',v.category);if(category===null)return;try{await api('/api/videos/'+encodeURIComponent(v.id)+'/metadata',{method:'POST',body:JSON.stringify({title:name,category})});await refresh()}catch(e){status.textContent=e.message}};
  const del=document.createElement('button');del.className='danger';del.textContent='Delete';del.onclick=async()=>{if(!confirm('Permanently delete '+v.title+'?'))return;try{await api('/api/videos/'+encodeURIComponent(v.id),{method:'DELETE'});selected.delete(v.id);await refresh()}catch(e){status.textContent=e.message}};
  buttons.append(edit,del);meta.append(title,details,buttons);wrap.append(check,meta);li.append(wrap);list.append(li);
 }
 $('selectAll').textContent=videos.length&&videos.every(v=>selected.has(v.id))?'Clear selection':'Select all';updateSelection();
 if(!videos.length)list.textContent='No videos uploaded yet.';
}
async function refresh(){try{
 const response=await fetch('/api/videos');if(!response.ok)throw new Error('HTTP '+response.status);const j=await response.json();
 const videos=Array.isArray(j.videos)?j.videos:[],storage=j.storage||{},used=Number(storage.usedBytes||0),pending=Number(storage.pendingBytes||0),max=Number(storage.maxBytes||10000000000),total=used+pending,pct=Math.min(100,total/max*100);
 $('usage').textContent=(total/1e9).toFixed(2)+' / '+(max/1e9).toFixed(2)+' GB used'+(pending?' • '+(pending/1e9).toFixed(2)+' GB pending':'');
 $('storageBar').style.width=pct+'%';$('storageBar').style.background=pct>=95?'#d86b62':pct>=85?'#ffbd6b':'#8064dc';
 $('storageBar').parentElement.setAttribute('aria-valuenow',String(Math.round(pct)));
 $('storageHint').textContent=pct>=95?'Almost full. Delete videos you no longer need before uploading.':pct>=85?'Storage is getting low. Review your library before adding more.':'Completed videos: '+(used/1e9).toFixed(2)+' GB • Pending uploads: '+(pending/1e9).toFixed(2)+' GB';
 $('storageHint').className=pct>=85?'warning':'muted';const valid=new Set(videos.map(v=>v.id));for(const id of selected)if(!valid.has(id))selected.delete(id);
 renderVideos(videos);
 }catch(e){status.textContent='Could not load library: '+e.message}}
$('selectAll').onclick=()=>{if(currentVideos.length&&currentVideos.every(v=>selected.has(v.id)))selected.clear();else currentVideos.forEach(v=>selected.add(v.id));renderVideos(currentVideos)};
$('deleteSelected').onclick=async()=>{const targets=currentVideos.filter(v=>selected.has(v.id));if(!targets.length)return;if(!confirm('Permanently delete '+targets.length+' selected video(s)? This cannot be undone.'))return;
 $('deleteSelected').disabled=true;let deleted=0;for(const v of targets){try{await api('/api/videos/'+encodeURIComponent(v.id),{method:'DELETE'});selected.delete(v.id);deleted++}catch(e){status.textContent='Deleted '+deleted+' of '+targets.length+'. Stopped: '+e.message;break}}
 if(deleted===targets.length)status.textContent='Deleted '+deleted+' video(s).';await refresh()};
async function uploadFile(file){if(file.size<=0)throw new Error('Empty file: '+file.name);const start=await api('/api/upload/start',{method:'POST',body:JSON.stringify({filename:file.name,title:$('title').value,category:$('category').value,size:file.size})}),parts=[],partSize=start.partSize,total=Math.ceil(file.size/partSize);try{for(let i=0;i<total;i++){const chunk=file.slice(i*partSize,Math.min(file.size,(i+1)*partSize));status.textContent='Uploading '+file.name+' • part '+(i+1)+'/'+total;const r=await fetch('/api/upload/part?id='+encodeURIComponent(start.id)+'&uploadId='+encodeURIComponent(start.uploadId)+'&partNumber='+(i+1),{method:'PUT',headers:auth(),body:chunk}),p=await r.json();if(!r.ok)throw new Error(p.error||'Part upload failed');parts.push(p);progress.value=(i+1)/total*100}await api('/api/upload/complete',{method:'POST',body:JSON.stringify({id:start.id,uploadId:start.uploadId,parts})});status.textContent='Uploaded '+file.name}catch(e){try{await api('/api/upload/abort',{method:'POST',body:JSON.stringify({id:start.id,uploadId:start.uploadId})})}catch(ignore){}throw e}}
$('upload').onclick=async()=>{if(!token.value.trim())return status.textContent='Enter your admin token.';const files=[...$('files').files];if(!files.length)return status.textContent='Choose MP4 files first.';$('upload').disabled=true;progress.hidden=false;try{for(const f of files)await uploadFile(f);status.textContent='All selected files uploaded.';$('files').value='';await refresh()}catch(e){status.textContent='Upload stopped: '+e.message}finally{$('upload').disabled=false;progress.hidden=true;progress.value=0}};
$('refresh').onclick=refresh;refresh();
</script></body></html>
