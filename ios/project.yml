name: Anilarper
options:
  bundleIdPrefix: app.anilarper
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Anilarper:
    type: application
    platform: iOS
    sources:
      - path: Anilarper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.anilarper.ios
        PRODUCT_NAME: Anilarper
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Anilarper
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
