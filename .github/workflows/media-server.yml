name: Validate media server

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "media-server/**"
      - ".github/workflows/media-server.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile media server
        run: python -m py_compile media-server/server.py