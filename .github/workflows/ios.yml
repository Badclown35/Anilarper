name: Build Anilarper iOS

on:
  workflow_dispatch:
    inputs:
      build_ipa:
        description: "Also create a signed iPhone IPA (requires Apple signing secrets)"
        required: false
        default: false
        type: boolean
  push:
    branches: [ main ]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml

      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -project ios/Anilarper.xcodeproj \
            -scheme Anilarper \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload iOS Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: Anilarper-iOS-Simulator
          path: build/ios/Build/Products/Debug-iphonesimulator/Anilarper.app

      - name: Install Apple distribution signing assets
        if: ${{ inputs.build_ipa }}
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-Anilarper
        run: |
          set -euo pipefail
          test -n "$CERTIFICATE_BASE64"
          test -n "$CERTIFICATE_PASSWORD"
          test -n "$PROFILE_BASE64"
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/distribution.p12"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/profile.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/anilarper.keychain"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/anilarper.keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/anilarper.keychain"
          security import "$RUNNER_TEMP/signing/distribution.p12" \
            -k "$RUNNER_TEMP/anilarper.keychain" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/anilarper.keychain"
          security list-keychains -d user -s "$RUNNER_TEMP/anilarper.keychain"
          security default-keychain -s "$RUNNER_TEMP/anilarper.keychain"
          security cms -D -i "$RUNNER_TEMP/signing/profile.mobileprovision" > "$RUNNER_TEMP/signing/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/signing/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/signing/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "IOS_PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Archive signed iOS app
        if: ${{ inputs.build_ipa }}
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          set -euo pipefail
          test -n "$IOS_TEAM_ID"
          test -n "$IOS_BUNDLE_ID"
          xcodebuild \
            -project ios/Anilarper.xcodeproj \
            -scheme Anilarper \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Anilarper.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_UUID" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
            archive

      - name: Export signed IPA
        if: ${{ inputs.build_ipa }}
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
            <key>provisioningProfiles</key><dict>
              <key>$IOS_BUNDLE_ID</key><string>$IOS_PROFILE_UUID</string>
            </dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/Anilarper.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/ipa

      - name: Upload signed IPA
        if: ${{ inputs.build_ipa }}
        uses: actions/upload-artifact@v4
        with:
          name: Anilarper-iOS-IPA
          path: build/ipa/*.ipa
